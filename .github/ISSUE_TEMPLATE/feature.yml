name: ✨ 기능 개발
description: 새로운 기능 또는 개선해야 할 작업을 등록해 주세요.
title: "[Feature] "

body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 구현하거나 변경해야 할 내용을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 작업 목적
      description: 이 작업이 필요한 이유를 작성해주세요.

  - type: textarea
    id: tasks
    attributes:
      label: 세부 작업
      placeholder: |
        - [ ] UI 구현
        - [ ] API 연동
        - [ ] 동작 확인

  - type: textarea
    id: additional
    attributes:
      label: 참고사항 및 참고자료
